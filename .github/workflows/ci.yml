name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Demo replays from committed cache
        run: |
          # --limit 12 selects the inline cases, the only ones cache/ci recorded. The 60
          # in cases.jsonl are for real model runs and would miss the replay cache.
          promptci run examples/json_extract/suite.yaml --model replay/any --limit 12 \
            --db /tmp/ci.db --json
