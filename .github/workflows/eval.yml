# Regression gate. Replays the eval suite from the committed cache (no network, no
# API key), compares the PR's run against the baseline recorded on main, posts the
# comparison table as a PR comment, and fails if the CI of the mean delta sits
# below -threshold.
#
# Milestone M5 finishes this workflow. What is here works today for the demo suite;
# the TODOs mark what M5 adds.
#
# How the baseline works: `results/baseline/<suite>.db` on main holds the run that
# main's prompt + cache produce. A PR that changes the prompt must also commit the
# re-recorded cache entries (recorded locally with Ollama), otherwise the replay
# misses and the job fails, which is the intended behavior.

name: eval

on:
  pull_request:
    paths:
      - "examples/**"
      - "cache/ci/**"
      - "src/promptci/**"
      - ".github/workflows/eval.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .

      - name: Run baseline (main's suite against the committed cache)
        run: |
          # pipefail: `promptci run` exits non-zero when cases error, and without it
          # `| tee` would mask that. A run where every case errored still scores 0.000,
          # so the compare below would report "no detectable change" and pass the gate.
          set -o pipefail
          git worktree add /tmp/main origin/main
          promptci run /tmp/main/examples/json_extract/suite.yaml \
            --model replay/any --cache-dir cache/ci --db /tmp/eval.db --label baseline --json \
            | tee /tmp/baseline.json

      - name: Run candidate (this PR's suite against the committed cache)
        run: |
          set -o pipefail
          promptci run examples/json_extract/suite.yaml \
            --model replay/any --cache-dir cache/ci --db /tmp/eval.db --label candidate --json \
            | tee /tmp/candidate.json

      - name: Compare
        id: compare
        run: |
          A=$(python -c "import json;print(json.load(open('/tmp/baseline.json'))['run_id'])")
          B=$(python -c "import json;print(json.load(open('/tmp/candidate.json'))['run_id'])")
          set +e
          promptci compare "$A" "$B" --db /tmp/eval.db --fail-on-regression > /tmp/compare.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/compare.md

      - name: Post comparison as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- promptci-eval -->\n' + fs.readFileSync('/tmp/compare.md', 'utf8');
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({owner, repo, issue_number});
            const prev = comments.data.find(c => c.body.startsWith('<!-- promptci-eval -->'));
            if (prev) {
              await github.rest.issues.updateComment({owner, repo, comment_id: prev.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Fail on regression
        if: steps.compare.outputs.exit != '0'
        run: |
          echo "promptci compare exited with ${{ steps.compare.outputs.exit }} (3 = regression)"
          exit 1

      # TODO (M5): run every suite under examples/ that has cache entries, not just
      # json_extract. Attach the HTML comparison report as a workflow artifact.
